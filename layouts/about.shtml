<extend template="base.shtml">
<head id="head"></head>

<title id="title">The Full Stack Data Dev</title>
<body id="body">
  <div :html="$page.contentSection('intro')"></div>
  <div :html="$page.contentSection('team')"></div>
  <div :loop="$site.page('authors').subpagesAlphabetic()">
    <h2 id="$loop.it.authors.at(0)"><a href="$loop.it.link()" :text="$loop.it.title"></a></h2>
    <div :html="$loop.it.content()"></div>
  </div>
  <div :html="$page.contentSection('misc')"></div>
</body>
